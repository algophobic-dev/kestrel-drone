<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kestrel Drone</title>
<meta name="description" content="Free airspace, weather and preflight app for drone pilots, recreational and Part 107.">
<meta name="theme-color" content="#10161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kestrel Drone">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-map"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></g>
    <g id="i-wx"><path d="M7 18a4 4 0 010-8 5 5 0 019.6-1.4A3.5 3.5 0 1117.5 18H7z"/></g>
    <g id="i-log"><path d="M6 3h11a2 2 0 012 2v16H8a2 2 0 01-2-2V3zM6 17h13M10 7h5M10 11h5"/></g>
    <g id="i-drone"><circle cx="5.5" cy="5.5" r="2.5"/><circle cx="18.5" cy="5.5" r="2.5"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/><path d="M7.5 7.5l3 3M16.5 7.5l-3 3M7.5 16.5l3-3M16.5 16.5l-3-3"/><rect x="10" y="10" width="4" height="4" rx="1"/></g>
    <g id="i-check"><path d="M4 12l5 5L20 6"/></g>
    <g id="i-more"><path d="M4 6h16M4 12h16M4 18h16"/></g>
    <g id="i-layers"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></g>
    <g id="i-target"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></g>
  </defs>
</svg>
<div id="app">
  <header class="top">
    <div class="name"><img src="icons/icon-180.png" alt="">Kestrel Drone<span class="note" style="font-weight:400">by Kestrel Aviation Solutions</span></div>
    <button class="mode" id="mode-badge" title="Change pilot mode">Part 107</button>
  </header>
  <main>
    <section class="view active" id="v-map">
      <div id="map"></div>
      <div class="map-bar">
        <button class="btn" id="btn-here" title="Check where you are"><svg class="ic"><use href="#i-target"/></svg>Check my location</button>
        <div class="spacer"></div>
        <button class="btn sq" id="btn-layers" title="Map layers"><svg class="ic"><use href="#i-layers"/></svg></button>
      </div>
      <div class="pop hidden" id="layers-pop"></div>
      <div class="check hidden" id="check"></div>
    </section>
    <section class="view" id="v-wx"></section>
    <section class="view" id="v-log"></section>
    <section class="view" id="v-drones"></section>
    <section class="view" id="v-list"></section>
    <section class="view" id="v-more"></section>
  </main>
  <nav id="tabs" aria-label="Sections">
    <button data-v="map" class="on"><svg class="ic"><use href="#i-map"/></svg>Map</button>
    <button data-v="wx"><svg class="ic"><use href="#i-wx"/></svg>Weather</button>
    <button data-v="log"><svg class="ic"><use href="#i-log"/></svg>Log</button>
    <button data-v="drones"><svg class="ic"><use href="#i-drone"/></svg>Drones</button>
    <button data-v="list"><svg class="ic"><use href="#i-check"/></svg>Checklist</button>
    <button data-v="more"><svg class="ic"><use href="#i-more"/></svg>More</button>
  </nav>
</div>
<div class="modal hidden" id="modal"></div>
<div class="toast hidden" id="toast"></div>
<script src="lib/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
